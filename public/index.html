<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#3b5bdb">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">

<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/edition.css">
<script>
  try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t;
    else if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark'; } catch {}
</script>
</head>
<body>
<div class="app">
  <aside class="nav">

    <a href="#/" data-nav="home"><span class="ico">◧</span>الرئيسية</a>
    <a href="#/months" data-nav="months"><span class="ico">▤</span>الأشهر</a>
    <a href="#/reports" data-nav="reports"><span class="ico">▦</span>التقارير</a>
    <a href="#/goals" data-nav="goals"><span class="ico">◎</span>الأهداف</a>
    <a href="#/settings" data-nav="settings"><span class="ico">⚙</span>الإعدادات</a>
    <div class="mini">
      <div>سعر اليوم</div>
      <b class="num" id="todayRate">—</b>
      <div class="navtools">

        <button class="btn sm" id="privBtn" title="إخفاء المبالغ">👁</button>
      </div>
    </div>
  </aside>
  <main class="main" id="view"><div class="spinner"></div></main>
</div>
<nav class="tabbar">

</nav>
<div class="toasts" id="toasts"></div>

<script src="/vendor/chart.js/chart.umd.js"></script>
<script src="/shared/calc.js"></script>
